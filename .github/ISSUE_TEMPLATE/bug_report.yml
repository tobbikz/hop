name: Bug report
description: Report a reproducible problem in Hop
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please run `hop --doctor` and include its output.
        Do not paste passwords or private keys.
  - type: input
    id: version
    attributes:
      label: Hop version
      description: Output of `hop --version`
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "Arch Linux, kernel 6.12, kitty 0.40"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant lines from `~/.cache/hop/hop.log`
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Diagnostics
      description: Output of `hop --doctor`
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues
          required: true
        - label: I removed passwords, keys and other secrets from this report
          required: true
