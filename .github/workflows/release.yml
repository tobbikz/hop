name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p ide-app --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          asset="hop-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$asset" hop
          shasum -a 256 "$asset" > "$asset.sha256"
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            hop-*.tar.gz
            hop-*.tar.gz.sha256
          generate_release_notes: true
