[workspace]
resolver = "2"
members = [
    "crates/ide-core",
    "crates/ide-config",
    "crates/ide-term",
    "crates/ide-sessions",
    "crates/ide-ui",
    "crates/ide-app",
]
default-members = ["crates/ide-app"]

[workspace.package]
version = "0.6.1"
edition = "2021"
license = "Apache-2.0"
authors = ["tui-sessions contributors"]
rust-version = "1.85"

[workspace.dependencies]
ide-core = { path = "crates/ide-core" }
ide-config = { path = "crates/ide-config" }
ide-term = { path = "crates/ide-term" }
ide-sessions = { path = "crates/ide-sessions" }
ide-ui = { path = "crates/ide-ui" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nucleo-matcher = "0.3"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
unicode-width = "0.2"
portable-pty = "0.8"
vt100 = "0.15"
tempfile = "3"
